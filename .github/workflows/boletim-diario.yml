name: boletim-diario

on:
  push:
    branches:
      - main

permissions:
  contents: read
  issues: write

jobs:
  boletim-diario:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: verificar-e-instalar-ferramentas
        run: |
          if ! command -v curl &> /dev/null; then
            sudo apt-get update -y && sudo apt-get install -y curl
          fi

          if ! command -v python3 &> /dev/null; then
            sudo apt-get update -y && sudo apt-get install -y python3 python3-pip
          fi
          pip3 install --quiet beautifulsoup4 lxml

          if ! command -v jq &> /dev/null; then
            sudo apt-get update -y && sudo apt-get install -y jq
          fi

          if ! command -v gh &> /dev/null; then
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
              | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) \
              signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] \
              https://cli.github.com/packages stable main" \
              | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            sudo apt-get update -y && sudo apt-get install -y gh
          fi

      - name: criar-boletim
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x ./script.sh
          bash ./script.sh

          echo "SCRIPT_DATA=$(date +'%d/%m/%Y')" >> "$GITHUB_ENV"

          echo 'SCRIPT_CONTEUDO<<EOF' >> "$GITHUB_ENV"
          cat boletim_final.txt >> "$GITHUB_ENV"
          echo 'EOF' >> "$GITHUB_ENV"

          chmod +x ./number.sh
          bash ./number.sh

          var=$(cat numero_final.txt)
          if [ "$var" = "pr" ]; then
            echo "Nenhuma issue aberta para fechar."
          else
            gh issue close "$var" --reason "completed" || true
          fi

      - uses: JasonEtco/create-an-issue@v2
        id: create-issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATA: ${{ env.SCRIPT_DATA }}
        with:
          filename: .github/boletim.md

      - name: adicionar-comentario
        uses: peter-evans/create-or-update-comment@v2
        with:
          issue-number: ${{ steps.create-issue.outputs.number }}
          reactions: '+1'
          body: |
            ${{ env.SCRIPT_CONTEUDO }}
